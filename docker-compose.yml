services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner}
      POSTGRES_DB: scanner
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://scanner:${POSTGRES_PASSWORD:-scanner}@db:5432/scanner
      # Fail fast instead of silently deploying with a public default secret.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before deploying (see .env.example)}
    depends_on:
      - db
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata:
