[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# B008: FastAPI Depends()/Form() in defaults is the framework idiom.
# BLE001/S112: OCR/vision adapters are architecturally "never raise" (see
# docs/architecture.md) — broad guards with continue/fallback are intentional.
ignore = ["B008", "BLE001", "S112"]

[tool.black]
line-length = 110

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
