name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements.txt ruff black mypy pytest
      - run: ruff check backend/app backend/tests
      - run: black --check backend/app backend/tests
      - run: python -m mypy backend/app
      - run: python ml/accept_phase1.py --count 5
      - run: python -m pytest tests -q
        working-directory: backend
